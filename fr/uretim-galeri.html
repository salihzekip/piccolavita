<script>
const media = [
  { type: 'img', src: '../assets/images/uretim/uretim-01.jpg', caption: 'Notre châssis' },
  { type: 'img', src: '../assets/images/uretim/uretim-02.jpg', caption: 'Notre ossature en acier' },

  { type: 'img', src: '../assets/images/uretim/uretim-14.jpg', caption: '' },
  { type: 'img', src: '../assets/images/uretim/uretim-15.jpg', caption: 'Pose de nos lambris MDF sur les murs intérieurs' },
  { type: 'img', src: '../assets/images/uretim/uretim-16.jpg', caption: 'Pose du Tyvek terminée' },
  { type: 'img', src: '../assets/images/uretim/uretim-36.jpg', caption: 'La laine de roche a aussi été posée au plafond' },
  { type: 'img', src: '../assets/images/uretim/uretim-35.jpg', caption: 'Notre toit est prêt' },
  { type: 'img', src: '../assets/images/uretim/uretim-17.jpg', caption: 'Exemples de pose du Tyvek et des lambris' },

  { type: 'img', src: '../assets/images/uretim/uretim-19.jpg', caption: 'Pose des encadrements de fenêtres et de portes' },

  { type: 'img', src: '../assets/images/uretim/uretim-31.jpg', caption: 'Nos appliques murales sont également terminées' },
  { type: 'img', src: '../assets/images/uretim/uretim-32.jpg', caption: 'Préparation de la véranda et de la pergola' },
  { type: 'img', src: '../assets/images/uretim/uretim-33.jpg', caption: 'Notre tiny house retrouve son propriétaire' },
  { type: 'img', src: '../assets/images/uretim/uretim-34.jpg', caption: 'Emménagement' },
];
const total = media.length;
let idx = 0;

const gImg = document.getElementById('gImg');
const gVideo = document.getElementById('gVideo');
const gStepCaption = document.getElementById('gStepCaption');

function render() {
  const item = media[idx];
  gVideo.pause();
  if (item.type === 'img') {
    gImg.src = item.src;
    gImg.style.display = '';
    gVideo.style.display = 'none';
    gVideo.removeAttribute('src');
  } else {
    gVideo.src = item.src;
    gVideo.style.display = '';
    gImg.style.display = 'none';
    gImg.removeAttribute('src');
  }
  gStepCaption.textContent = item.caption || '';
  document.getElementById('gCounter').textContent = (idx + 1) + ' / ' + total;
  document.querySelectorAll('.gthumb').forEach((el, i) => el.classList.toggle('gt-active', i === idx));
  const active = document.querySelector('.gthumb.gt-active');
  if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}
function gStep(d) { idx = (idx + d + total) % total; render(); }

const thumbs = document.getElementById('gThumbs');
media.forEach((item, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'gthumb';
  if (item.type === 'img') {
    const im = document.createElement('img');
    im.src = item.src;
    im.alt = item.caption || ('Étape de production ' + (i + 1));
    im.loading = 'lazy';
    wrap.appendChild(im);
  } else {
    const vid = document.createElement('video');
    vid.src = item.src + '#t=0.1';
    vid.muted = true;
    vid.preload = 'metadata';
    vid.playsInline = true;
    wrap.appendChild(vid);
    const play = document.createElement('span');
    play.className = 'gthumb-play';
    play.textContent = '▶';
    wrap.appendChild(play);
  }
  wrap.addEventListener('click', () => { idx = i; render(); });
  thumbs.appendChild(wrap);
});
render();

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') gStep(-1);
  if (e.key === 'ArrowRight') gStep(1);
  if (e.key === 'Escape') window.location.href = 'index.html#uretim';
});

window.PVGallery = {
  get idx() { return idx; },
  setIdx(v) { idx = ((v % total) + total) % total; render(); },
  get total() { return total; },
  getItem(i) { return media[i]; },
};
</script>
