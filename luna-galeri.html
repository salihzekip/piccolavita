.gstage img, .gstage video {

.gnav {

  color: var(--white); font-size: 22px; display: flex; align-items: center; justify-content: center;
  transition: background .2s, border-color .2s; z-index: 2;
}
.gnav:hover { background: rgba(255,255,255,.18); border-color: var(--accent); }
.gprev { left: -64px; } .gnext { right: -64px; }
@media (max-width: 900px) {
  .gmain { padding: 0 16px 20px; }
  .gprev { left: 6px; } .gnext { right: 6px; }
  .gnav { width: 38px; height: 38px; font-size: 18px; background: rgba(0,0,0,.35); }
}

.gcaption { text-align: center; margin-top: 22px; }
.gcaption h1 { font-family: var(--serif); font-size: 26px; font-weight: 700; color: var(--white); }
.gcaption h1 em { font-style: italic; color: var(--accent); }
.gcounter { margin-top: 6px; font-size: 12px; font-weight: 700; letter-spacing: .1em; color: rgba(255,255,255,.5); }

.gspecs {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  max-width: 900px; margin: 22px auto 0; padding: 0 20px;
}
.gspec {
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
  border-radius: 10px; padding: 10px 18px; text-align: center; min-width: 88px;
}
.gspec-label {
  font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--accent);
}
.gspec-value { font-size: 15px; font-weight: 700; color: var(--white); margin-top: 3px; }

.gthumbs {
  display: flex; gap: 8px; overflow-x: auto; padding: 0 28px 24px; flex-shrink: 0;
  scrollbar-width: thin;
}
.gthumbs .gthumb {
  position: relative; width: 68px; height: 52px; border-radius: 6px; cursor: pointer;
  opacity: .45; transition: opacity .2s, outline .2s; flex-shrink: 0;
  outline: 2px solid transparent; overflow: hidden;
}
.gthumbs .gthumb img, .gthumbs .gthumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.gthumbs .gthumb:hover { opacity: .8; }
.gthumbs .gthumb.gt-active { opacity: 1; outline-color: var(--accent); }
.gthumb-play {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.25); color: #fff; font-size: 16px; pointer-events: none;
}

.gtop-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.gwa {

.gbottom-cta { display: flex; justify-content: center; padding: 8px 28px 40px; flex-shrink: 0; }

<script>
const media = [
  { type: 'img', src: 'assets/images/luna/luna-01.png' },
  { type: 'img', src: 'assets/images/luna/luna-02.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-03.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-04.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-05.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-06.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-07.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-08.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-09.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-10.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-11.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-12.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-13.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-14.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-15.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-16.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-17.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-18.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-19.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-20.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-21.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-22.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-23.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-24.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-25.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-26.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-27.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-28.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-29.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-30.jpg' },
  { type: 'img', src: 'assets/images/luna/luna-31.jpg' },
  { type: 'video', src: 'assets/videos/luna/luna-01.mp4' },
];
const total = media.length;
let idx = 0;

const gImg = document.getElementById('gImg');
const gVideo = document.getElementById('gVideo');

function render() {
  const item = media[idx];
  gVideo.pause();
  if (item.type === 'img') {
    gImg.src = item.src;
    gImg.style.display = '';
    gVideo.style.display = 'none';
    gVideo.removeAttribute('src');
  } else {
    gVideo.src = item.src;
    gVideo.style.display = '';
    gImg.style.display = 'none';
    gImg.removeAttribute('src');
  }
  document.getElementById('gCounter').textContent = (idx + 1) + ' / ' + total;
  document.querySelectorAll('.gthumb').forEach((el, i) => el.classList.toggle('gt-active', i === idx));
  const active = document.querySelector('.gthumb.gt-active');
  if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}
function gStep(d) { idx = (idx + d + total) % total; render(); }

const thumbs = document.getElementById('gThumbs');
media.forEach((item, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'gthumb';
  if (item.type === 'img') {
    const im = document.createElement('img');
    im.src = item.src;
    im.alt = 'Luna fotoğraf ' + (i + 1);
    im.loading = 'lazy';
    wrap.appendChild(im);
  } else {
    const vid = document.createElement('video');
    vid.src = item.src + '#t=0.1';
    vid.muted = true;
    vid.preload = 'metadata';
    vid.playsInline = true;
    wrap.appendChild(vid);
    const play = document.createElement('span');
    play.className = 'gthumb-play';
    play.textContent = '▶';
    wrap.appendChild(play);
  }
  wrap.addEventListener('click', () => { idx = i; render(); });
  thumbs.appendChild(wrap);
});
render();

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') gStep(-1);
  if (e.key === 'ArrowRight') gStep(1);
  if (e.key === 'Escape') window.location.href = 'index.html#modeller';
});
</script>
