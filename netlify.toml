[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Eski (.asp) site sayfalarindan yeni sayfalara 301 yonlendirme (Google index'inde hala eski linkler var)
[[redirects]]
  from = "/arte_tiny_house.asp"
  to = "/10metre-arte-galeri.html"
  status = 301
  force = true

[[redirects]]
  from = "/studio_tiny_house.asp"
  to = "/studio-galeri.html"
  status = 301
  force = true

[[redirects]]
  from = "/cesme.asp"
  to = "/comfort-galeri.html"
  status = 301
  force = true

[[redirects]]
  from = "/tiny_house_modelleri.asp"
  to = "/tum-modeller.html"
  status = 301
  force = true

[[redirects]]
  from = "/centro_tiny_house.asp"
  to = "/tum-modeller.html"
  status = 301
  force = true

[[redirects]]
  from = "/piccolavita.asp"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/belgeler.asp"
  to = "/"
  status = 301
  force = true

# Genel yakalama: yukaridaki ozel kurallara girmeyen ve gercekte var olmayan HERHANGI bir sayfa
# (eski .asp linkleri dahil) icin 404 yerine ana sayfaya 301. force=true YOK: gercek/var olan
# sayfalar bu kuraldan etkilenmez, Netlify once statik dosyayi arar.
[[redirects]]
  from = "/*"
  to = "/"
  status = 301
