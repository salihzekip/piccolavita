[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Eski (.asp) site sayfalarindan yeni sayfalara 301 yonlendirme (Google index'inde hala eski linkler var)
[[redirects]]
  from = "/arte_tiny_house.asp"
  to = "/10metre-arte-galeri.html"
  status = 301
  force = true

[[redirects]]
  from = "/studio_tiny_house.asp"
  to = "/studio-galeri.html"
  status = 301
  force = true

[[redirects]]
  from = "/cesme.asp"
  to = "/comfort-galeri.html"
  status = 301
  force = true

[[redirects]]
  from = "/tiny_house_modelleri.asp"
  to = "/tum-modeller.html"
  status = 301
  force = true

[[redirects]]
  from = "/centro_tiny_house.asp"
  to = "/tum-modeller.html"
  status = 301
  force = true

[[redirects]]
  from = "/piccolavita.asp"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/belgeler.asp"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/lavoro_tiny_office.asp"
  to = "/lavoro-galeri.html"
  status = 301
  force = true

[[redirects]]
  from = "/akyaka.asp"
  to = "/akyaka-galeri.html"
  status = 301
  force = true

[[redirects]]
  from = "/bayilik.asp"
  to = "/"
  status = 301
  force = true

# Genel yakalama: yukaridaki ozel kurallara girmeyen ve gercekte var olmayan HERHANGI bir sayfa
# icin (uzantili .asp/.php yollari dahil) Netlify'nin standart 404 sayfasi yerine ana sayfa
# icerigini goster. status=404 ozel bir davranis: normal /* redirect kurallari nokta iceren
# (dosya gibi gorunen) yollarda atlaniyor, ama status=404 ile tanimlanan kural Netlify'nin
# "custom 404 page" mekanizmasi oldugu icin uzantili yollarda da calisiyor. Gercek/var olan
# sayfalar bundan etkilenmez, once statik dosya aranir.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
