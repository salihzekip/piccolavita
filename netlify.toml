[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# netlify.app alt alan adi ana domainin kopyasi olarak indexlenmesin
[[redirects]]
  from = "https://piccolavita.netlify.app/*"
  to = "https://piccolavita.com/:splat"
  status = 301
  force = true

