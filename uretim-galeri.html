<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Üretim Aşamaları — Fotoğraf ve Video Galerisi | Piccola Vita</title>
<meta name="description" content="Piccola Vita tiny house üretim süreci — şaseden teslimata kadar tüm aşamalar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary:   #2F4A3D;
  --secondary: #8A5A3B;
  --accent:    #C8A36A;
  --forest:    #111c11;
  --white:     #ffffff;
  --serif:     'Playfair Display', Georgia, serif;
  --sans:      'Montserrat', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--sans); background: var(--forest); color: var(--white);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
  display: flex; flex-direction: column; min-height: 100vh;
}
a { text-decoration: none; color: inherit; }
button { font-family: var(--sans); cursor: pointer; border: none; background: none; color: inherit; }

.gtop {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 28px; flex-shrink: 0;
}
.gtop-logo { font-family: var(--serif); font-weight: 700; font-size: 20px; letter-spacing: .03em; color: var(--white); }
.gtop-back {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600; letter-spacing: .04em; color: rgba(255,255,255,.75);
  padding: 8px 16px; border: 1px solid rgba(255,255,255,.25); border-radius: 30px;
  transition: color .2s, border-color .2s, background .2s;
}
.gtop-back:hover { color: var(--white); border-color: var(--accent); background: rgba(255,255,255,.06); }

.gmain {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; padding: 0 70px 24px;
}
.gstage { position: relative; width: 100%; max-width: 1200px; }
.gstage img, .gstage video {
  display: block; width: 100%; max-height: 62vh; object-fit: contain;
  border-radius: 10px; background: #000; margin: 0 auto;
}
.gnav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 48px; height: 48px; border-radius: 50%;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2);
  color: var(--white); font-size: 22px; display: flex; align-items: center; justify-content: center;
  transition: background .2s, border-color .2s; z-index: 2;
}
.gnav:hover { background: rgba(255,255,255,.18); border-color: var(--accent); }
.gprev { left: -64px; } .gnext { right: -64px; }
@media (max-width: 900px) {
  .gmain { padding: 0 16px 20px; }
  .gprev { left: 6px; } .gnext { right: 6px; }
  .gnav { width: 38px; height: 38px; font-size: 18px; background: rgba(0,0,0,.35); }
}

.gcaption { text-align: center; margin-top: 22px; max-width: 700px; }
.gcaption h1 { font-family: var(--serif); font-size: 26px; font-weight: 700; color: var(--white); }
.gcaption h1 em { font-style: italic; color: var(--accent); }
.gstep-caption {
  margin-top: 10px; font-size: 17px; font-weight: 600; color: rgba(255,255,255,.88);
  min-height: 24px;
}
.gcounter { margin-top: 8px; font-size: 12px; font-weight: 700; letter-spacing: .1em; color: rgba(255,255,255,.5); }

.gthumbs {
  display: flex; gap: 8px; overflow-x: auto; padding: 0 28px 24px; flex-shrink: 0;
  scrollbar-width: thin;
}
.gthumbs .gthumb {
  position: relative; width: 68px; height: 52px; border-radius: 6px; cursor: pointer;
  opacity: .45; transition: opacity .2s, outline .2s; flex-shrink: 0;
  outline: 2px solid transparent; overflow: hidden;
}
.gthumbs .gthumb img, .gthumbs .gthumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.gthumbs .gthumb:hover { opacity: .8; }
.gthumbs .gthumb.gt-active { opacity: 1; outline-color: var(--accent); }
.gthumb-play {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.25); color: #fff; font-size: 16px; pointer-events: none;
}
</style>
</head>
<body>

<div class="gtop">
  <a href="index.html" class="gtop-logo">PICCOLAVITA</a>
  <a href="index.html#uretim" class="gtop-back">← Ana Sayfaya Dön</a>
</div>

<div class="gmain">
  <div class="gstage">
    <button class="gnav gprev" onclick="gStep(-1)" aria-label="Önceki">‹</button>
    <img id="gImg" src="" alt="Üretim Aşaması">
    <video id="gVideo" controls playsinline style="display:none"></video>
    <button class="gnav gnext" onclick="gStep(1)" aria-label="Sonraki">›</button>
  </div>
  <div class="gcaption">
    <h1>Üretim <em>Aşamaları</em></h1>
    <div class="gstep-caption" id="gStepCaption"></div>
    <div class="gcounter" id="gCounter">1 / 37</div>
  </div>
</div>

<div class="gthumbs" id="gThumbs"></div>

<script>
const media = [
  { type: 'img', src: 'assets/images/uretim/uretim-01.jpg', caption: 'Şasemiz' },
  { type: 'img', src: 'assets/images/uretim/uretim-02.jpg', caption: 'Demir karkasımız' },
  { type: 'img', src: 'assets/images/uretim/uretim-03.jpg', caption: 'Karkasımız şaseye monte ediliyor' },
  { type: 'img', src: 'assets/images/uretim/uretim-04.jpg', caption: '' },
  { type: 'video', src: 'assets/videos/uretim/uretim-01.mp4', caption: 'Karkas montajı' },
  { type: 'img', src: 'assets/images/uretim/uretim-05.jpg', caption: 'Karkas bitmek üzere' },
  { type: 'img', src: 'assets/images/uretim/uretim-06.jpg', caption: '' },
  { type: 'img', src: 'assets/images/uretim/uretim-07.jpg', caption: 'OSB ve playwood montajı' },
  { type: 'img', src: 'assets/images/uretim/uretim-08.jpg', caption: 'OSB montajı bitti' },
  { type: 'img', src: 'assets/images/uretim/uretim-09.jpg', caption: 'Elektrik tesisatı döşeniyor' },
  { type: 'img', src: 'assets/images/uretim/uretim-10.jpg', caption: 'Elektrik tesisatı bitti' },
  { type: 'img', src: 'assets/images/uretim/uretim-11.jpg', caption: 'Tyvek döşeniyor' },
  { type: 'img', src: 'assets/images/uretim/uretim-12.jpg', caption: '' },
  { type: 'img', src: 'assets/images/uretim/uretim-13.jpg', caption: 'Bir yandan da içeride taş yünler döşeniyor' },
  { type: 'img', src: 'assets/images/uretim/uretim-14.jpg', caption: '' },
  { type: 'img', src: 'assets/images/uretim/uretim-15.jpg', caption: 'İç duvarlarımız MDF lambrilerimiz döşeniyor' },
  { type: 'img', src: 'assets/images/uretim/uretim-16.jpg', caption: 'Tyvekler bitti' },
  { type: 'img', src: 'assets/images/uretim/uretim-17.jpg', caption: 'Tyvek ve lambri döşemelerden örnekler' },
  { type: 'img', src: 'assets/images/uretim/uretim-18.jpg', caption: 'Banyo WC işlemleri başladı' },
  { type: 'img', src: 'assets/images/uretim/uretim-19.jpg', caption: 'Pencere, kapı sövelerimiz takılıyor' },
  { type: 'img', src: 'assets/images/uretim/uretim-20.jpg', caption: 'Lambri döşememiz bitti' },
  { type: 'img', src: 'assets/images/uretim/uretim-21.jpg', caption: 'Islak zemin için ctp döşeniyor' },
  { type: 'img', src: 'assets/images/uretim/uretim-22.jpg', caption: 'Kompozit paneller döşenmeye başlandı' },
  { type: 'img', src: 'assets/images/uretim/uretim-23.jpg', caption: 'Boya işleri başladı' },
  { type: 'img', src: 'assets/images/uretim/uretim-24.jpg', caption: 'Thermowoodlar döşendi' },
  { type: 'img', src: 'assets/images/uretim/uretim-25.jpg', caption: 'Doğramalarımız takıldı' },
  { type: 'img', src: 'assets/images/uretim/uretim-26.jpg', caption: 'Dolaplarımız, saklama alanları takılıyor' },
  { type: 'img', src: 'assets/images/uretim/uretim-27.jpg', caption: 'Boya bitti, parkeler döşeniyor' },
  { type: 'img', src: 'assets/images/uretim/uretim-28.jpg', caption: 'Mutfak dolapları da tamam' },
  { type: 'img', src: 'assets/images/uretim/uretim-29.jpg', caption: 'Loft katımız ve döşenen parkeler' },
  { type: 'img', src: 'assets/images/uretim/uretim-30.jpg', caption: 'Kendini belli eden bölümlerimiz' },
  { type: 'img', src: 'assets/images/uretim/uretim-31.jpg', caption: 'Apliklerimiz de tamam' },
  { type: 'img', src: 'assets/images/uretim/uretim-32.jpg', caption: 'Veranda ve pergole hazırlığı' },
  { type: 'img', src: 'assets/images/uretim/uretim-33.jpg', caption: 'Sahibine kavuşan tinymiz' },
  { type: 'img', src: 'assets/images/uretim/uretim-34.jpg', caption: 'Yerleştik' },
  { type: 'img', src: 'assets/images/uretim/uretim-35.jpg', caption: 'Çatımız da hazır' },
  { type: 'img', src: 'assets/images/uretim/uretim-36.jpg', caption: 'Tavana da taşyün döşendi' },
];
const total = media.length;
let idx = 0;

const gImg = document.getElementById('gImg');
const gVideo = document.getElementById('gVideo');
const gStepCaption = document.getElementById('gStepCaption');

function render() {
  const item = media[idx];
  gVideo.pause();
  if (item.type === 'img') {
    gImg.src = item.src;
    gImg.style.display = '';
    gVideo.style.display = 'none';
    gVideo.removeAttribute('src');
  } else {
    gVideo.src = item.src;
    gVideo.style.display = '';
    gImg.style.display = 'none';
    gImg.removeAttribute('src');
  }
  gStepCaption.textContent = item.caption || '';
  document.getElementById('gCounter').textContent = (idx + 1) + ' / ' + total;
  document.querySelectorAll('.gthumb').forEach((el, i) => el.classList.toggle('gt-active', i === idx));
  const active = document.querySelector('.gthumb.gt-active');
  if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}
function gStep(d) { idx = (idx + d + total) % total; render(); }

const thumbs = document.getElementById('gThumbs');
media.forEach((item, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'gthumb';
  if (item.type === 'img') {
    const im = document.createElement('img');
    im.src = item.src;
    im.alt = item.caption || ('Üretim aşaması ' + (i + 1));
    im.loading = 'lazy';
    wrap.appendChild(im);
  } else {
    const vid = document.createElement('video');
    vid.src = item.src + '#t=0.1';
    vid.muted = true;
    vid.preload = 'metadata';
    vid.playsInline = true;
    wrap.appendChild(vid);
    const play = document.createElement('span');
    play.className = 'gthumb-play';
    play.textContent = '▶';
    wrap.appendChild(play);
  }
  wrap.addEventListener('click', () => { idx = i; render(); });
  thumbs.appendChild(wrap);
});
render();

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') gStep(-1);
  if (e.key === 'ArrowRight') gStep(1);
  if (e.key === 'Escape') window.location.href = 'index.html#uretim';
});
</script>

</body>
</html>
